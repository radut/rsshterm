# The rsshterm .deb, built by desktop/packaging/scripts/package-linux.sh (nfpm, image goreleaser/nfpm) from the
# staged build of desktop/packaging/scripts/build-linux.sh, which fills in the ${RSSHTERM_*} and ${DEB_MAINTAINER}.
name: rsshterm
version: ${RSSHTERM_VERSION}
arch: ${RSSHTERM_ARCH}
platform: linux
section: net
priority: optional
maintainer: ${DEB_MAINTAINER}
vendor: rSshTerm
homepage: https://rssh-ea902a.gitlab.io
license: Apache-2.0
description: |-
  rSshTerm desktop SSH terminal
   Local and SSH terminal tabs with splits, a vault of hosts and keys synced
   between devices, and an ssh-agent that serves the vault's keys to every shell.
# The Swift runtime is linked in statically; the GTK 4 app (desktop/linux) links these dynamically.
depends:
  - libc6
  - libgtk-4-1 (>= 4.14)
  - libadwaita-1-0 (>= 1.5)
  - libvte-2.91-gtk4-0 (>= 0.76)
  # RDP screens (RSSHRDP on the system's FreeRDP 3)
  - libfreerdp3-3
  - libfreerdp-client3-3
  - libwinpr3-3
  - libcurl4t64
  - libxml2
  - openssh-client
# secret-tool keeps the vault's device key in the Secret Service (a file fallback without it); pkexec runs the apt
# upgrade from the updater; xdg-utils opens links.
recommends:
  - libsecret-tools
  - pkexec
  - xdg-utils
contents:
  # The build: rsshterm and any SwiftPM resource bundles next to it (Bundle.module looks beside the real binary).
  - src: ${RSSHTERM_STAGE}
    dst: /usr/lib/rsshterm
    type: tree
  - src: /usr/lib/rsshterm/rsshterm
    dst: /usr/bin/rsshterm
    type: symlink
  # Desktop entry, AppStream metadata and icons: the Linux app's own files (desktop/linux/packaging/).
  - src: desktop/linux/packaging/dev.rsshterm.RSSHTerm.desktop
    dst: /usr/share/applications/dev.rsshterm.RSSHTerm.desktop
    file_info: { mode: 0644 }
  - src: desktop/linux/packaging/dev.rsshterm.RSSHTerm.metainfo.xml
    dst: /usr/share/metainfo/dev.rsshterm.RSSHTerm.metainfo.xml
    file_info: { mode: 0644 }
  - src: desktop/linux/packaging/icons/hicolor
    dst: /usr/share/icons/hicolor
    type: tree
  - src: desktop/packaging/deb/copyright
    dst: /usr/share/doc/rsshterm/copyright
    file_info: { mode: 0644 }
  # Third-party notices, generated by packaging/licenses/generate.py (CI job legal:notices keeps it current).
  - src: desktop/packaging/THIRD_PARTY_NOTICES
    dst: /usr/share/doc/rsshterm/THIRD_PARTY_NOTICES
    file_info: { mode: 0644 }
