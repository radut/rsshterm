# rsshd release build: static binaries, .deb (amd64, arm64), tarballs (linux + macOS, amd64 + arm64), SHA256SUMS.
# Run from rsshd/. CI: `rsshd:package` (snapshot, every main/MR pipeline) and `rsshd:build` (tag rsshd-vX.Y.Z).
# Signing and publishing are NOT done here: packaging/scripts/publish.sh signs SHA256SUMS and the apt repo.
#
# Local: docker run --rm -v "$PWD/..:/src" -w /src/rsshd -e GORELEASER_CURRENT_TAG=v0.0.0 \
#          goreleaser/goreleaser:v2.20.0 release --snapshot --clean
version: 2
project_name: rsshd

before:
  hooks:
    - sh packaging/scripts/debian-changelog.sh "{{ .Version }}" packaging/.build

builds:
  - id: rsshd
    main: ./cmd/rsshd
    binary: rsshd
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    # main.version is the contract with the daemon's code: `rsshd version` prints it.
    ldflags: ["-s -w -X main.version={{ .Version }}"]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: tarballs
    ids: [rsshd]
    formats: [tar.gz]
    name_template: "rsshd_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # install.sh takes the unit / agent from the tarball and points it at the installed binary.
    files:
      - src: packaging/systemd/rsshd.service
        dst: rsshd.service
      - src: packaging/launchd/dev.rssh.rsshd.plist
        dst: dev.rssh.rsshd.plist
      # Third-party notices (Go standard library, x/sys, toml), generated by packaging/licenses/generate.py.
      - src: packaging/THIRD_PARTY_NOTICES
        dst: THIRD_PARTY_NOTICES

checksum:
  name_template: SHA256SUMS
  algorithm: sha256

snapshot:
  # "~" sorts before the release in dpkg, so a later real release always upgrades a snapshot.
  version_template: "{{ incpatch .Version }}~git{{ .ShortCommit }}"

nfpms:
  - id: deb
    ids: [rsshd]
    package_name: rsshd
    file_name_template: "{{ .PackageName }}_{{ .Version }}_{{ .Arch }}"
    formats: [deb]
    vendor: rSshTerm
    homepage: https://github.com/radut/rsshterm
    maintainer: Radu Toader <radu.m.toader@gmail.com>
    description: |-
      Session daemon for the rSshTerm app
       rsshd keeps terminal sessions alive in tmux while the phone is away, enforces
       idle and hard timeouts, and talks to the app over the existing SSH connection.
       It runs as a systemd user service that each user enables for themselves.
    license: Apache-2.0
    section: net
    priority: optional
    bindir: /usr/bin
    dependencies: [tmux]
    # reptyr moves running programs into a session: recommended, so plain `apt install` brings it (skipped with
    # --no-install-recommends). screen is the optional second backend (create.backend "screen"); never a dependency.
    recommends: [reptyr]
    suggests: [screen]
    contents:
      - src: packaging/systemd/rsshd.service
        dst: /usr/lib/systemd/user/rsshd.service
        file_info: { mode: 0644 }
      - src: packaging/apt/52rsshd-unattended
        dst: /etc/apt/apt.conf.d/52rsshd-unattended
        type: config
        file_info: { mode: 0644 }
      # The repo key, owned by the package so a key refresh reaches every client with the next upgrade
      # (the apt source's Signed-By points here; install.sh writes the first copy).
      - src: packaging/rssh-archive-keyring.asc
        dst: /usr/share/keyrings/rsshd-archive-keyring.asc
        file_info: { mode: 0644 }
      # GNU screen settings for the screen backend (rsshd also has them built in when this file is absent).
      - src: internal/backend/screen/screenrc
        dst: /usr/share/rsshd/screenrc
        file_info: { mode: 0644 }
      - src: packaging/deb/copyright
        dst: /usr/share/doc/rsshd/copyright
        file_info: { mode: 0644 }
      - src: packaging/THIRD_PARTY_NOTICES
        dst: /usr/share/doc/rsshd/THIRD_PARTY_NOTICES
        file_info: { mode: 0644 }
      - src: packaging/.build/changelog.gz
        dst: /usr/share/doc/rsshd/changelog.gz
        file_info: { mode: 0644 }
      - src: packaging/deb/lintian-overrides
        dst: /usr/share/lintian/overrides/rsshd
        file_info: { mode: 0644 }
    scripts:
      postinstall: packaging/deb/postinst
      preremove: packaging/deb/prerm

release:
  disable: true
changelog:
  disable: true
